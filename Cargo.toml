[workspace]
resolver = "2"
members = ["crates/core"]
# TODO: re-add crates/app in Task 11

[workspace.package]
edition = "2021"
rust-version = "1.95"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
uuid         = { version = "1", features = ["v4", "serde"] }
parking_lot  = "0.12"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
